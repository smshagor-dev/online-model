name: Format PHP source once
on:
  push:
    paths:
      - '.github/workflows/format-php-once.yml'
permissions:
  contents: write
jobs:
  php-format:
    if: github.ref == 'refs/heads/fix/nvidia-catalog-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, curl, xml
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/pint
      - name: Commit formatted PHP sources
        run: |
          git add -u
          if git diff --cached --quiet; then
            echo "PHP sources already formatted."
          else
            git config user.name "OpenMindAI Maintainers"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: format Laravel PHP sources"
            git push origin HEAD:fix/nvidia-catalog-validation
          fi
