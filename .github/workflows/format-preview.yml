name: Format preview

on:
  push:
    branches:
      - feature/developer-api-portal
    paths:
      - '.github/workflows/format-preview.yml'

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pint
      - name: Export formatter changes for review
        shell: bash
        run: |
          php -r '
          $paths = explode("\n", trim((string) shell_exec("git diff --name-only -- \"*.php\"")));
          foreach ($paths as $path) {
            if ($path === "" || !is_file($path)) continue;
            echo "PINT_FILE_BEGIN:".$path."\n";
            foreach (str_split(base64_encode(file_get_contents($path)), 1024) as $chunk) {
              echo "PINT_FILE_DATA:".$chunk."\n";
            }
            echo "PINT_FILE_END\n";
          }
          '
